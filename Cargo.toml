[workspace]

[package]
name = "simtap"
version = "0.1.0"
edition = "2021"
description = "Standalone faithful emulation of a Linux st-driver SCSI tape drive, exposed over FUSE"

[[bin]]
name = "simtap"
path = "src/main.rs"

[lib]
name = "simtap"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fuser = "0.18"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
